<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #060505; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #060505; }
      .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
/* HeyMars brand fonts (SIL Open Font License 1.1), latin subsets copied from the app's own next/font build.
   Schibsted Grotesk: captions and UI text. Martian Mono: every number. Michroma: the HEYMARS wordmark only. */
@font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 400 700; font-display: block;
  src: url("assets/kit/fonts/schibsted-grotesk-latin.woff2") format("woff2"); }
@font-face { font-family: "Martian Mono"; font-style: normal; font-weight: 100 800; font-stretch: 75% 112.5%; font-display: block;
  src: url("assets/kit/fonts/martian-mono-latin.woff2") format("woff2"); }
@font-face { font-family: "Michroma"; font-style: normal; font-weight: 400; font-display: block;
  src: url("assets/kit/fonts/michroma-latin.woff2") format("woff2"); }

/* Launch film kit — shared tokens and components (film scale: authored in real 1920x1080 pixels).
   BRAND: replace the tokens in :root with the product's own design tokens (ink, muted greys, canvas, the dark
   stage, status colours, font). Chrome stays monochrome; colour arrives only from content (logos, status chips,
   product UI, the customer's own colours). No gradients, no glows. Loaded once in index.html <head>
   (tools/build.mjs) and by tools/qa.mjs. Namespace: rk- / window.RK (historical; keep it). */

/* ── Tokens ─────────────────────────────────────────────────────────────── */
/* HeyMars tokens (docs/DESIGN_SYSTEM.md): near-black, bone text, a hue only when it means something. */
:root {
  --font: "Schibsted Grotesk", system-ui, sans-serif;
  --mono: "Martian Mono", ui-monospace, monospace;
  --disp: "Michroma", "Schibsted Grotesk", sans-serif;
  --bg-0: #060505; --bg-1: #0d0b0b; --bg-2: #161313; --bg-3: #1e1a19;
  --text-1: #ece7e1; --text-2: #a39c95; --text-3: #8a837d;
  --hm-accent: #e0884a; --data: #5cc8ff; --go: #58c98a; --caution: #f3d250; --nogo: #e0544c;
  --ink: #ece7e1;
  --muted: #a39c95;
  --quiet: #8a837d;
  --faint: #6f6862;
  --line: rgba(236, 231, 225, 0.10);
  --line-strong: rgba(236, 231, 225, 0.22);
  --canvas: #060505;
  --surface: #0d0b0b;
  --surface-2: #161313;
  --panel: #0d0b0b;
  --fill: #161313;
  --thread: #0d0b0b;
  --stage: #060505;
  --stage-2: #0d0b0b;
  --stage-ink: #ece7e1;
  --stage-quiet: #a39c95;
  --stage-line: rgba(236, 231, 225, 0.10);
  --booked: #58c98a; --booked-soft: rgba(88, 201, 138, 0.14);
  --pending: #f3d250; --pending-soft: rgba(243, 210, 80, 0.14);
  --overdue: #e0544c; --overdue-soft: rgba(224, 84, 76, 0.14);
  --ask-peach: #161313; --ask-lilac: #161313; --ask-sage: #161313; --ask-composer: #161313;
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
  --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.5);
  --shadow-stage: 0 10px 30px rgba(0, 0, 0, 0.5);
  --accent: #ece7e1;
  --accent-soft: rgba(236, 231, 225, 0.06);
  --accent-line: rgba(236, 231, 225, 0.28);
  --yolk: #ece7e1;
}

/* (HeyMars tokens above replace the launch-film defaults) */
/* ── Scene frame ────────────────────────────────────────────────────────── */
.rk-scene {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
  font-family: var(--font); color: var(--ink);
  -webkit-font-smoothing: antialiased; font-kerning: normal;
}
.rk-scene, .rk-scene * { box-sizing: border-box; margin: 0; }  /* same reset as index.html */
.rk-ground { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--canvas); }
.rk-ground.is-stage { background: var(--stage); }
.rk-center { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.rk-world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }

/* ── Type (display weight 400, like the site hero) ──────────────────────── */
.t-hero  { font-size: 128px; line-height: 1.04; font-weight: 400; letter-spacing: -0.035em; text-align: center; white-space: nowrap; }
.t-title { font-size: 96px;  line-height: 1.08; font-weight: 400; letter-spacing: -0.032em; text-align: center; }
.t-head  { font-size: 64px;  line-height: 1.12; font-weight: 500; letter-spacing: -0.025em; text-align: center; }
.t-sub   { font-size: 44px;  line-height: 1.3;  font-weight: 400; letter-spacing: -0.012em; text-align: center; color: var(--muted); }
.t-cap   { font-size: 34px;  line-height: 1.35; font-weight: 400; letter-spacing: -0.008em; color: var(--muted); }
.t-accent { color: inherit; }               /* v3: emphasis is the ink half of a two-tone line */
.t-quiet  { color: var(--quiet); }          /* the muted half */
.t-muted  { color: var(--muted); }
.t-num    { font-variant-numeric: tabular-nums; }
.on-stage .t-hero, .on-stage .t-title, .on-stage .t-head { color: var(--stage-ink); }
.on-stage .t-sub, .on-stage .t-cap, .on-stage .t-quiet { color: var(--stage-quiet); }
.rk-line  { display: block; }
.rk-word  { display: inline-block; will-change: transform, opacity, filter; }

/* Strike-through drawn by RK.strike(): the struck words turn quiet; the line is ink. */
.rk-strike { position: absolute; left: -1.5%; width: 103%; top: 54%; height: 7px; border-radius: 7px; background: var(--ink); transform-origin: 0 50%; transform: scaleX(0); }

/* ── Surfaces ───────────────────────────────────────────────────────────── */
.rk-window { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 32px; box-shadow: var(--shadow-lg); overflow: hidden; }
.rk-card   { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 32px; box-shadow: var(--shadow-md); }
.on-stage .rk-card, .on-stage .rk-window { box-shadow: var(--shadow-stage); border-color: rgba(255,255,255,0.06); }
.rk-card-head { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 36px 48px 28px; font-size: 34px; font-weight: 500; }
.rk-card-body { padding: 0 48px 40px; }
.rk-divider { height: 1px; background: var(--line); }

/* ── Rows ───────────────────────────────────────────────────────────────── */
.rk-row { display: grid; grid-template-columns: 260px 1fr auto; align-items: center; column-gap: 28px; min-height: 104px; border-top: 1px solid var(--line); font-size: 36px; }
.rk-row .k { color: var(--muted); font-size: 32px; }
.rk-row .v { font-weight: 500; }
.rk-row .v small { display: block; font-size: 30px; font-weight: 400; color: var(--muted); margin-top: 4px; }
.rk-task { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; column-gap: 28px; min-height: 108px; border-top: 1px solid var(--line); font-size: 38px; }
.rk-task .v { font-weight: 500; }
.rk-task .v small { display: block; font-size: 30px; font-weight: 400; color: var(--muted); margin-top: 4px; }

/* ── Chips & buttons (labelled, never dots) ─────────────────────────────── */
.rk-chip { display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 28px; border-radius: 999px; font-size: 30px; font-weight: 500; white-space: nowrap; }
.rk-chip.is-booked  { background: var(--booked-soft);  color: var(--booked); }
.rk-chip.is-pending { background: var(--pending-soft); color: var(--pending); }
.rk-chip.is-overdue { background: var(--overdue-soft); color: var(--overdue); }
.rk-chip.is-accent  { background: var(--fill); color: var(--ink); }
.rk-chip.is-neutral { background: #fff; color: var(--ink); border: 1px solid var(--line-strong); }
.rk-chip.is-ink     { background: var(--ink); color: #fff; }
.rk-btn { display: inline-flex; align-items: center; justify-content: center; gap: 14px; height: 104px; padding: 0 52px; border-radius: 999px; font-size: 38px; font-weight: 500; white-space: nowrap; transform-origin: 50% 50%; }
.rk-btn.is-primary   { background: var(--ink); color: #fff; }
.rk-btn.is-secondary { background: #fff; color: var(--ink); border: 1px solid var(--line-strong); }
.rk-btn.is-accent    { background: var(--ink); color: #fff; }

/* ── Messages ───────────────────────────────────────────────────────────── */
.rk-bubble { display: inline-block; max-width: 1100px; padding: 30px 40px; border-radius: 36px; font-size: 42px; line-height: 1.38; letter-spacing: -0.01em; }
.rk-bubble.is-in  { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 12px; box-shadow: var(--shadow-md); }
.rk-bubble.is-out { background: var(--ink); color: #fff; border-bottom-right-radius: 12px; }
.rk-bubble .meta { display: block; margin-top: 10px; font-size: 30px; opacity: 0.6; }
.rk-grounded { white-space: nowrap; text-decoration: underline dotted rgba(18,19,22,0.38); text-decoration-thickness: 3px; text-underline-offset: 10px; }

/* ── Notification card ──────────────────────────────────────────────────── */
.rk-notif { display: grid; grid-template-columns: 80px 1fr auto; column-gap: 28px; align-items: center; width: 1040px; min-height: 150px; padding: 28px 36px; background: #fff; border: 1px solid var(--line); border-radius: 32px; box-shadow: var(--shadow-md); }
.rk-notif img { width: 72px; height: 72px; object-fit: contain; }
.rk-notif .who { font-size: 32px; font-weight: 500; }
.rk-notif .what { font-size: 32px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 780px; }
.rk-notif .when { font-size: 30px; color: var(--muted); align-self: start; margin-top: 6px; }

/* ── App tiles & logos ──────────────────────────────────────────────────── */
.rk-tile { display: flex; align-items: center; justify-content: center; width: 176px; height: 176px; background: #fff; border: 1px solid var(--line); border-radius: 40px; box-shadow: var(--shadow-md); }
.rk-tile img { width: 104px; height: 104px; object-fit: contain; }
.rk-tile.is-sm { width: 128px; height: 128px; border-radius: 30px; }
.rk-tile.is-sm img { width: 72px; height: 72px; }

/* ── People ─────────────────────────────────────────────────────────────── */
.rk-avatar { display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: 50%; background: var(--fill); color: var(--muted); font-size: 30px; font-weight: 500; flex: none; }
.rk-avatar.is-lg { width: 104px; height: 104px; font-size: 38px; }

/* ── Check mark (booked colour) ─────────────────────────────────────────── */
.rk-check { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; background: var(--booked-soft); transform-origin: 50% 50%; }
.rk-check svg { width: 30px; height: 30px; }

/* ── Composer (legacy) ──────────────────────────────────────────────────── */
.rk-composer { display: flex; align-items: center; gap: 28px; width: 1440px; height: 152px; padding: 0 28px 0 48px; background: var(--ask-composer); border: 1px solid var(--line-strong); border-radius: 40px; box-shadow: var(--shadow-lg); }
.rk-composer .field { flex: 1; font-size: 48px; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; }
.rk-composer .placeholder { color: var(--faint); }
.rk-send { display: inline-flex; align-items: center; justify-content: center; width: 104px; height: 104px; border-radius: 50%; background: var(--ink); flex: none; transform-origin: 50% 50%; }
.rk-caret { display: inline-block; width: 4px; height: 1.02em; margin-left: 4px; vertical-align: -0.14em; background: var(--ink); border-radius: 2px; }

/* ── Assistant chat (an "Ask <Product>" panel) at film scale ───────────── */
.ask-mascot { width: 64px; height: 64px; object-fit: contain; flex: none; }
.ask-mascot.is-lg { width: 120px; height: 120px; }
.ask-head { display: flex; align-items: center; gap: 20px; font-size: 40px; font-weight: 500; letter-spacing: -0.015em; }
.ask-q { display: inline-block; max-width: 1200px; padding: 28px 40px; border-radius: 28px; background: var(--ink); color: #fff; font-size: 44px; line-height: 1.32; letter-spacing: -0.012em; }
.ask-a { font-size: 48px; line-height: 1.34; letter-spacing: -0.015em; }
.ask-status { display: inline-flex; align-items: center; gap: 16px; font-size: 34px; color: var(--muted); }
.ask-src { font-size: 30px; color: var(--muted); }
.ask-actionbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 28px 44px; border-top: 1px solid var(--line); font-size: 32px; color: var(--muted); }
.ask-link { color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px; }
.ask-sparkle { width: 44px; height: 44px; fill: var(--ink); }

/* ── Cursor ─────────────────────────────────────────────────────────────── */
.rk-cursor { position: absolute; left: 0; top: 0; opacity: 0; width: 60px; height: 80px; z-index: 50; transform-origin: 8% 6%; filter: drop-shadow(0 6px 14px rgba(0,0,0,.22)); }

/* ── Product mark (monochrome stroke logo, drawn on with RK.draw) ─────────── */
.rk-mark path { fill: none; stroke: var(--ink); stroke-width: 5.2; stroke-linecap: round; stroke-linejoin: round; }
.on-stage .rk-mark path { stroke: var(--stage-ink); }
.rk-wordmark { font-size: 176px; font-weight: 500; letter-spacing: -0.045em; line-height: 1; }

/* A whole-scene wrapper for a scene's own camera moves (tools/build.mjs plays the transitions between scenes). */
.rk-tx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }

/* The v2 glow is retired (the design system bans gradients). */
.rk-bloom { display: none !important; }

/* ── Dark stage (for product-story scenes) ────────────────────────────────── */
/* Put .on-stage on the scene root and .is-stage on its ground. Text sitting directly on the stage turns
   light; UI surfaces (cards, windows, bubbles) stay white with ink text, exactly like the site. Card-less
   UI placed straight on the stage goes inside .stage-ui and takes the app's dark-mode tokens. */
.on-stage { color: var(--stage-ink); }
.on-stage .rk-card, .on-stage .rk-window, .on-stage .rk-notif, .on-stage .rk-bubble.is-in, .on-stage .rk-composer { color: var(--ink); }
.stage-ui .rk-chip.is-booked  { background: rgba(74, 222, 128, 0.14);  color: #4ade80; }
.stage-ui .rk-chip.is-pending { background: rgba(245, 178, 76, 0.14);  color: #f5b24c; }
.stage-ui .rk-chip.is-overdue { background: rgba(244, 121, 111, 0.14); color: #f4796f; }
.stage-ui .rk-chip.is-neutral { background: transparent; color: var(--stage-ink); border-color: rgba(255, 255, 255, 0.18); }
.stage-ui .rk-btn.is-primary   { background: var(--stage-ink); color: var(--ink); }
.stage-ui .rk-btn.is-secondary { background: transparent; color: var(--stage-ink); border: 1px solid rgba(255, 255, 255, 0.18); }
.stage-ui .rk-check { background: rgba(74, 222, 128, 0.14); }
.stage-ui .rk-check path { stroke: #4ade80; }
.stage-ui .t-muted, .stage-ui .t-cap { color: #a0a0a9; }
.stage-ui .rk-grounded { text-decoration-color: rgba(244, 244, 246, 0.42); }
.stage-ui .rk-caret { background: var(--stage-ink); }

/* ── HeyMars film components ────────────────────────────────────────────── */
.hm-mono { font-family: var(--mono); font-stretch: 87.5%; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.hm-wordmark { position: absolute; left: 0; width: 1920px; text-align: center; font-family: var(--disp); font-size: 132px; line-height: 1.1; letter-spacing: 0.06em; color: var(--text-1); white-space: nowrap; }
.hm-tagline { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 60px; line-height: 1.15; font-weight: 500; letter-spacing: -0.015em; color: var(--text-1); white-space: nowrap; }
.hm-scrim { position: absolute; left: 0; top: 0; width: 1920px; height: 880px; background: var(--bg-0); }
/* the caption band: a flat near-black plate under the footage, one caption line + the data credit */
.hm-band { position: absolute; left: 0; top: 880px; width: 1920px; height: 200px; background: var(--bg-0); border-top: 1px solid var(--line-strong); }
.hm-cap { position: absolute; left: 0; top: 904px; width: 1920px; text-align: center; font-size: 56px; line-height: 1.15; font-weight: 500; letter-spacing: -0.015em; color: var(--text-1); white-space: nowrap; }
.hm-credit { position: absolute; left: 0; top: 986px; width: 1920px; text-align: center; font-size: 30px; line-height: 1.2; color: var(--text-3); white-space: nowrap; }
/* callout label: a flat plate, never a pill; hairline + ring drawn in .hm-lines */
.hm-tag { position: absolute; background: var(--bg-1); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 20px 11px; font-size: 34px; line-height: 1.2; font-weight: 500; color: var(--text-1); white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.hm-lines { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
.hm-pending { position: absolute; right: 96px; top: 40px; background: #3a2a0c; border: 1px solid var(--caution); color: var(--caution); border-radius: 6px; padding: 6px 14px 8px; font-size: 28px; font-weight: 600; white-space: nowrap; }
/* EDL timeline over the landing shot */
.hm-edl { position: absolute; left: 96px; width: 1728px; height: 150px; background: rgba(6,5,5,.88); border: 1px solid var(--line-strong); border-radius: 10px; }
.hm-edl-rail { position: absolute; left: 120px; top: 74px; width: 1488px; height: 2px; background: var(--line-strong); }
.hm-edl-fill { position: absolute; left: 120px; top: 73px; width: 1488px; height: 4px; background: var(--text-1); transform-origin: 0 50%; }
.hm-edl-tick { position: absolute; top: 62px; width: 2px; height: 26px; background: var(--text-1); }
.hm-edl-mark { position: absolute; padding: 12px 0 0; height: 58px; font-size: 32px; line-height: 1.2; color: var(--text-1); white-space: nowrap; }
.hm-edl-mark b { font-weight: 500; }
.hm-edl-mark .hm-mono { color: var(--text-2); font-size: 30px; }
/* numbers inside a caption line: Martian Mono is wide, so it sits a step smaller and tighter than the sans */
.hm-cap .hm-mono, .s02-cap .hm-mono, .hm-tag .hm-mono, .s02-min .hm-mono { font-size: 0.88em; letter-spacing: -0.06em; font-weight: 500; }

    </style>
    <script>
/* Launch film — shared motion helpers (window.RK).
   Motion language: reveal = opacity 0→1 + a short rise + a light blur-in (3px), ~500ms, cubic-bezier(0, 0, 0.2, 1),
   siblings staggered 60–80ms; headlines build word by word; exits are a quick fade with a small push toward the
   camera (no blur, no drift), and the next line takes over just after — never both at once.
   Every helper adds seek-safe tweens to a PAUSED timeline and returns the end time.
   Rules: fromTo only, no repeat/yoyo, no randomness, no clocks. */
(function () {
  const q = (t) => (typeof t === "string" ? Array.from(document.querySelectorAll(t)) : t && t.length !== undefined && !(t instanceof Element) ? Array.from(t) : [t]);

  // cubic-bezier(x1, y1, x2, y2) as a GSAP ease function (Newton–Raphson on x, then y).
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }
      t = Math.min(1, Math.max(0, t));
      return sy(t);
    };
  }

  const E = {
    out: bezier(0, 0, 0.2, 1),          // brand reveal: decelerate into place
    soft: bezier(0.16, 1, 0.3, 1),      // long, gentle settle (camera arrivals, big type)
    io: bezier(0.65, 0, 0.35, 1),       // camera moves, layout glides
    in: bezier(0.4, 0, 1, 1),           // exits: accelerate away
    fast: bezier(0.2, 0.8, 0.2, 1),     // quick UI state changes
    linear: "none",
  };

  const RK = {
    E, bezier,

    /** Reveal: rise + fade + come into focus. o: { y=18, blur=6, dur=0.6, stagger=0.07, ease } */
    rise(tl, targets, at, o = {}) {
      const els = q(targets), dur = o.dur ?? 0.6, st = o.stagger ?? 0.07;
      if (o.fade) {
        // Opaque fast, move slow: a white surface on the dark stage must not pass through a grey half-fade.
        tl.fromTo(els, { y: o.y ?? 18 }, { y: 0, duration: dur, ease: o.ease ?? E.out, stagger: st }, at);
        tl.fromTo(els, { opacity: 0 }, { opacity: 1, duration: o.fade, ease: E.out, stagger: st }, at);
        return at + dur + st * Math.max(0, els.length - 1);
      }
      const from = { y: o.y ?? 18, opacity: 0 }, to = { y: 0, opacity: 1, duration: dur, ease: o.ease ?? E.out, stagger: st };
      if ((o.blur ?? 3) > 0) { from.filter = `blur(${o.blur ?? 3}px)`; to.filter = "blur(0px)"; }
      tl.fromTo(els, from, to, at);
      return at + dur + st * Math.max(0, els.length - 1);
    },

    /** Scale-in (UI surfaces): barely-there scale, fade, focus. o: { from=0.965, blur=4, dur=0.55, stagger=0.07 } */
    pop(tl, targets, at, o = {}) {

    cursor(tl, el, x0, y0, x1, y1, at, o = {}) {
