<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<template>
  <style>
    [data-composition-id="s03"] .hm-cam { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
    [data-composition-id="s03"] .hm-media { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; object-fit: cover; }
    [data-composition-id="s03"] .hm-slate { background: #1e1a19; border: 1px solid var(--line-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 140px; text-align: center; }
    [data-composition-id="s03"] .hm-slate b { font-size: 56px; font-weight: 600; color: var(--text-2); letter-spacing: 0.02em; }
    [data-composition-id="s03"] .hm-slate span { font-size: 30px; line-height: 1.35; color: var(--text-3); white-space: normal; }
  </style>
  <div id="s03-root" class="rk-scene on-stage" data-composition-id="s03" data-width="1920" data-height="1080" data-duration="3" data-qa-hold="3" data-qa-endhold="3">
    <div id="s03-ground" class="rk-ground is-stage clip" data-start="0" data-duration="3" data-track-index="0"></div>
    <div id="s03-cam" class="hm-cam" style="transform: translate(0px, 0px) scale(1.3333);">
      <div id="s03-m0" class="hm-media hm-slate clip" data-start="0" data-duration="3" data-track-index="1" data-qa-ignore><b>CAPTURE PENDING</b><span>Real Mars globe from orbit, then the camera falls to Jezero Crater (Cesium, JPL Mars Trek terrain)</span></div>
    </div>
    <div id="s03-scrim" class="hm-scrim" data-qa-ignore></div>
    <div id="s03-word" class="hm-wordmark" style="top: 300px;">HEYMARS</div>
    <div id="s03-tag" class="hm-tagline" style="top: 500px;">Point at Mars. Ask. It plans.</div>
    <div id="s03-pending" class="hm-pending" data-qa-ignore>CAPTURE PENDING</div>
    <div id="s03-band" class="hm-band"></div>
    <div id="s03-cap0" class="hm-cap">The whole real Mars, from orbit to the ground.</div>
    <div id="s03-credit" class="hm-credit">NASA imagery and terrain via JPL Mars Trek</div>
  </div>
  <script>
    (() => {
      const $ = (i) => document.getElementById(i);
      const tl = gsap.timeline({ paused: true });
      // camera (app CSS px -> frame px): translate then scale, origin 0 0
      tl.set($("s03-cam"), { x: 0, y: 0, scale: 1.3333, transformOrigin: "0 0" }, 0);
      tl.fromTo($("s03-cam"), { x: 0, y: 0, scale: 1.3333 }, { x: -76.8, y: -143.2, scale: 1.44, duration: 2.8, ease: "none", immediateRender: false }, 0.2);
      tl.fromTo($("s03-scrim"), { opacity: 0.72 }, { opacity: 0, duration: 0.5, ease: RK.E.in, immediateRender: false }, 1.35);
      RK.rise(tl, $("s03-word"), 0.0, { y: 14, dur: 0.6, fade: 0.2 });
      RK.words(tl, $("s03-tag"), 0.3, { stagger: 0.07 });
      RK.out(tl, [$("s03-word"), $("s03-tag")], 1.4, { dur: 0.25 });
      RK.words(tl, $("s03-cap0"), 1.65, { stagger: 0.05, dur: 0.45 });
      window.__timelines["s03"] = tl;
    })();
  </script>
</template>
</body>
</html>
