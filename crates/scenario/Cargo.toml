[package]
name = "scenario"
version = "0.1.0"
edition = "2021"
description = "MarsWalk Copilot scenario maths (landing Monte-Carlo, Horn slope) compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
